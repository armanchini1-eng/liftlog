<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>LiftLog</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftLog">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{
  --bg:#0b0c0e;--card:#16181c;--card2:#1f2228;--line:#2a2e35;--text:#f2f3f5;--muted:#8b919a;
  --accent:#3b9eff;--accent-bg:#12304d;--green:#2fbf71;--green-bg:#123524;--red:#ff5a5f;--orange:#f5a524;--purple:#b48cff;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
:root[data-theme=light]{
  --bg:#f3f4f6;--card:#ffffff;--card2:#eceef1;--line:#dcdfe4;--text:#14161a;--muted:#6a707a;
  --accent:#0a74da;--accent-bg:#dcecfb;--green:#1f9d57;--green-bg:#d9f2e4;--red:#d93a40;--orange:#b87400;--purple:#7a4fd6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}
body{position:fixed;inset:0;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;position:relative}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:12px 14px 28px}

/* header */
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--sat) + 8px) 12px 8px;
  display:flex;align-items:center;gap:8px;min-height:56px;border-bottom:1px solid var(--line)}
.hdr h1{font-size:22px;margin:0;flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .grow{flex:1;min-width:0}
.icon{min-width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--accent);padding:0 6px}
.icon:active,.row:active,.btn:active{opacity:.6}
.wname{width:100%;background:none;border:0;font-size:18px;font-weight:700;padding:2px 0;outline:none}
.sub{color:var(--muted);font-size:13px}
.tnum{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;
  background:var(--card2);font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:var(--accent-bg);color:var(--accent)}
.btn.danger{background:transparent;color:var(--red)}
.btn.block{display:flex;width:100%}
.btn.big{min-height:54px;font-size:17px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btnrow{display:flex;gap:8px;margin:10px 0}
.btnrow>*{flex:1}

/* cards / lists */
.card{background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.card h3{margin:0 0 4px;font-size:16px}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 4px 6px;font-weight:600;
  display:flex;align-items:center;gap:8px}
h2.sec .grow{flex:1}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:54px;padding:8px 12px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{background:var(--card);border-radius:14px;overflow:hidden;margin:8px 0}
.chev{color:var(--muted);font-size:20px}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.empty.sm{padding:14px 8px;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--muted);margin-left:6px;vertical-align:middle}
.tag.pr{background:#3d3210;color:var(--orange)}
:root[data-theme=light] .tag.pr{background:#fbeccb}
.pill{background:var(--card2);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap;font-weight:600;color:var(--muted);min-height:38px}
.pill.on{background:var(--accent);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;padding:6px 0}

/* inputs */
.inp,select.inp,textarea.inp{width:100%;background:var(--card2);border:1px solid transparent;border-radius:10px;padding:10px 12px;
  font-size:16px;outline:none;min-height:44px;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:none;min-height:44px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 2px 4px}
.search{margin:8px 14px 0}
.note{width:100%;background:none;border:0;color:var(--text);font-size:15px;padding:6px 2px;outline:none;resize:none}
.note::placeholder{color:var(--muted)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px}
.seg button{flex:1;min-height:36px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);padding:0 12px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* workout editor */
.wex{background:var(--card);border-radius:14px;margin:12px 0;padding:10px 8px 8px;border-left:4px solid transparent}
.wex.ss0{border-left-color:var(--purple)}.wex.ss1{border-left-color:var(--orange)}.wex.ss2{border-left-color:var(--green)}.wex.ss3{border-left-color:var(--red)}
.wex-h{display:flex;align-items:center;padding:0 4px}
.wex-h .name{flex:1;font-weight:700;font-size:17px;color:var(--accent);text-align:left;min-height:40px}
.wex .meta{padding:0 6px;font-size:13px;color:var(--muted)}
.wex .note{padding:6px}
.pin{margin:4px 6px;padding:6px 8px;border-radius:8px;background:var(--card2);font-size:13px;color:var(--muted)}
.sets{margin-top:4px}
.set,.sethead{display:grid;grid-template-columns:42px minmax(0,1fr) 78px 62px 46px;gap:6px;align-items:center;padding:3px 2px;border-radius:10px}
.set.wide,.sethead.wide{grid-template-columns:42px minmax(0,1fr) 86px 62px 46px}
.sethead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:center;font-weight:600}
.set{min-height:50px}
.set.done{background:var(--green-bg)}
.set.bad{animation:shake .3s;background:rgba(255,90,95,.18)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.setno{height:44px;border-radius:10px;background:var(--card2);font-weight:700;font-size:15px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center}
.setno small{font-size:10px;color:var(--muted);font-weight:600}
.set.warmup .setno{color:var(--orange)}.set.drop .setno{color:var(--purple)}.set.failure .setno{color:var(--red)}
.set.done .setno{background:transparent}
.prev{height:44px;color:var(--muted);font-size:14px;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-radius:10px;font-variant-numeric:tabular-nums}
.num{width:100%;height:44px;text-align:center;background:var(--card2);border:1px solid transparent;border-radius:10px;font-size:17px;font-weight:600;
  outline:none;padding:0 2px;font-variant-numeric:tabular-nums;-webkit-appearance:none}
.num:focus{border-color:var(--accent)}
.num::placeholder{color:var(--muted);opacity:.55;font-weight:500}
.set.done .num{background:transparent}
.cell{position:relative}
.cell .sign{position:absolute;left:0;top:0;width:26px;height:44px;color:var(--accent);font-weight:700;font-size:15px;z-index:1}
.cell.signed .num{padding-left:22px}
.chk{height:44px;border-radius:10px;background:var(--card2);font-size:20px;font-weight:700;color:var(--muted)}
.set.done .chk{background:var(--green);color:#fff}
.pace{text-align:right;font-size:12px;color:var(--muted);padding:0 54px 4px 0;font-variant-numeric:tabular-nums}
.addset{width:100%;min-height:44px;margin-top:6px;border-radius:10px;background:var(--card2);font-weight:600;font-size:15px}

/* rest bar */
#rest{position:relative;display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px + var(--sab));background:var(--card);border-top:1px solid var(--line);overflow:hidden}
#restfill{position:absolute;left:0;top:0;bottom:0;background:var(--accent-bg);width:0;transition:width .25s linear}
#rest>*:not(#restfill){position:relative}
#rest .mid{flex:1;text-align:center}
#resttime{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#rest .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
#rest.over #restfill{width:100%!important;background:var(--green-bg)}
#rest .btn{min-width:58px;padding:0 10px;min-height:48px}

/* mini bar + tabs */
#mini{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;background:var(--green-bg);color:var(--text);font-weight:600;text-align:left;border-top:1px solid var(--line)}
#mini .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mini .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
#tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sab)}
#tabs button{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--muted)}
#tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--accent)}

/* sheets */
#sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet-body{position:relative;background:var(--card);border-radius:18px 18px 0 0;padding:14px 14px calc(16px + var(--sab));max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body.full{height:100%;max-height:100%;border-radius:0;padding:0;background:var(--bg);display:flex;flex-direction:column}
.sheet-body.full .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body h3{margin:2px 2px 10px;font-size:18px}
.sheet-body .list{background:var(--card2)}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 6px;font-size:17px;text-align:left;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:0}
.mi.red{color:var(--red)}
.mi .grow{flex:1}
.mi .on{color:var(--accent);font-weight:700}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:11px;color:var(--muted);padding:4px 0}
.cal button{aspect-ratio:1;border-radius:10px;font-size:15px;position:relative;font-variant-numeric:tabular-nums}
.cal button.has{background:var(--accent-bg);color:var(--accent);font-weight:700}
.cal button.today{outline:1.5px solid var(--muted)}
.cal button.sel{background:var(--accent);color:#fff}

/* misc */
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.setline{display:flex;gap:10px;padding:3px 2px;font-size:15px;font-variant-numeric:tabular-nums}
.setline .n{width:22px;color:var(--muted);font-weight:700}
.setline .x{color:var(--muted);margin-left:auto;font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.chart svg{width:100%;height:auto;display:block}
.chart .tip{font-size:13px;color:var(--muted);min-height:18px;text-align:right}
.stepper{display:inline-flex;align-items:center;background:var(--card2);border-radius:10px}
.stepper button{width:40px;height:40px;font-size:20px;color:var(--accent)}
.stepper b{min-width:24px;text-align:center}
.rgrid{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.rgrid .num{width:52px;height:40px;font-size:16px}
.rgrid select{height:40px;background:var(--card2);border:0;border-radius:10px;padding:0 8px;font-size:15px;color:var(--text)}
.toggle{width:52px;height:32px;border-radius:16px;background:var(--card2);position:relative;flex:none;border:1px solid var(--line)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle.on{background:var(--green)}.toggle.on::after{transform:translateX(20px)}
.plates{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px 0;min-height:70px}
.plate{background:var(--accent);color:#fff;border-radius:6px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;width:34px}
.barend{height:10px;width:26px;background:var(--muted);border-radius:3px}
#toast{position:absolute;left:50%;bottom:calc(120px + var(--sab));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;max-width:90%;text-align:center}
</style>
</head>

<div id="app">
  <div id="view"></div>
  <div id="rest" hidden><div id="restfill"></div>
    <button class="btn" data-a="restAdj" data-d="-15" aria-label="Subtract 15 seconds">−15</button>
    <div class="mid"><div class="lbl" id="restlbl">Rest</div><div id="resttime">0:00</div></div>
    <button class="btn" data-a="restAdj" data-d="15" aria-label="Add 15 seconds">+15</button>
    <button class="btn ghost" data-a="restSkip">Skip</button>
  </div>
  <button id="mini" data-a="resume" hidden><span class="dot"></span><span class="grow tnum" id="minitext"></span><span>Open ›</span></button>

    <button data-a="tab" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6M2 20h20"/></svg>Progress</button>
    <button data-a="tab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>Settings</button>
  </nav>
  <div id="sheet" hidden></div>
  <div id="toast" hidden></div>
</div>

const S = {
  exercises: [], routines: [], folders: [], workouts: [], bodyweights: [],
  settings: { unit: 'lb', theme: 'dark', defaultRest: 120, sound: true, vibrate: true, wakeLock: true, lastBackup: 0 },
  active: null, persisted: null, storage: 'indexeddb'

/* ---------------- plate calculator ---------------- */
let plate = null;
function plateOut() {
  const kg = isKg(), sizes = kg ? [25, 20, 15, 10, 5, 2.5, 1.25] : [45, 35, 25, 10, 5, 2.5];
  const total = pNum(plate.w);
  if (total == null) return '<div class="empty sm">Enter the total weight on the bar.</div>';
  if (total < plate.bar) return `<div class="empty sm">That’s lighter than the ${plate.bar} ${U()} bar.</div>`;
  let side = (total - plate.bar) / 2; const out = [];
  for (const p of sizes) while (side >= p - 1e-9) { out.push(p); side -= p; }
  const counts = {}; out.forEach(p => counts[p] = (counts[p] || 0) + 1);
  const hmax = sizes[0];
  return `<div class="plates"><div class="barend"></div>${out.map(p => `<div class="plate" style="height:${28 + 42 * p / hmax}px">${p}</div>`).join('') || '<span class="sub">Empty bar</span>'}<div class="barend"></div></div>
    <div class="kv"><span>Each side</span><b>${out.length ? Object.keys(counts).sort((a, b) => b - a).map(p => `${counts[p] > 1 ? counts[p] + ' × ' : ''}${p}`).join(' + ') : '—'}</b></div>
    <div class="kv"><span>Loaded total</span><b>${num(total - side * 2)} ${U()}</b></div>
    ${side > 0.01 ? `<div class="sub" style="margin-top:8px">Can’t make ${num(total)} exactly — ${num(side * 2)} ${U()} short with these plates.</div>` : ''}`;
}
function plateSheet(w) {
  plate = { w: w != null ? wOut(w) : '', bar: isKg() ? 20 : 45 };
  sheet(() => `<h3>Plate calculator</h3>
    <label class="f">Total weight (${U()})</label><input class="inp" inputmode="decimal" data-i="plateW" value="${esc(plate.w)}" style="font-size:22px;font-weight:700;text-align:center">
    <label class="f">Bar</label><div class="chips wrap">${(isKg() ? [20, 15, 10] : [45, 35, 15]).map(b => `<button class="pill ${plate.bar === b ? 'on' : ''}" data-a="plateBar" data-b="${b}">${b} ${U()}</button>`).join('')}</div>
    <div id="plateOut">${plateOut()}</div>
    <button class="btn block" style="margin-top:12px" data-a="closeSheet">Done</button>`);
}
I.plateW = el => { plate.w = el.value; $('#plateOut').innerHTML = plateOut(); };
A.plateBar = el => { plate.bar = +el.dataset.b; sheetRefresh(); };
A.plates = () => {
  const w = curW(), we = mWE(), prev = prevSets(w, we); let val = null;
  const i = we.sets.findIndex(s => !s.done);
  if (i >= 0) val = we.sets[i].weight ?? hintFor(we, i, prev).weight;
  if (val == null) { const d = we.sets.filter(s => s.weight != null).pop(); val = d ? d.weight : null; }
  plateSheet(val);
};

    <label class="f">Name</label><input class="inp" data-i="xf" data-f="name" value="${esc(exForm.name)}" placeholder="Exercise name" autocomplete="off">
    <label class="f">Category</label><select class="inp" data-i="xf" data-f="category">${opt(CATS, exForm.category, cap)}</select>
    <label class="f">Main muscle group</label><select class="inp" data-i="xf" data-f="muscle">${opt(MUSCLES, exForm.muscle)}</select>
    <label class="f">Logged as</label><select class="inp" data-i="xf" data-f="type">${opt(Object.keys(TYPES), exForm.type, k => TYPES[k])}</select>
    ${exForm.type === 'distance' ? `<label class="f">Distance unit</label><select class="inp" data-i="xf" data-f="distUnit">${opt(['mi', 'km', 'm'], exForm.distUnit || 'mi', u => u === 'm' ? 'meters (pace per 500 m)' : u === 'mi' ? 'miles (pace per mile)' : 'kilometers (pace per km)')}</select>` : ''}
    <div class="btnrow"><button class="btn" data-a="xfCancel">Cancel</button><button class="btn primary" data-a="xfSave">Save</button></div>
    ${exForm.id ? '<button class="btn block danger" data-a="xfDelete">Delete exercise</button>' : ''}`);
}
I.xf = el => {
  const f = el.dataset.f; exForm[f] = el.value;
  if (f === 'category' && !exForm.id) exForm.type = el.value === 'bodyweight' ? 'bodyweight' : el.value === 'cardio' ? 'distance' : 'weight_reps';
  if (f === 'category' && el.value === 'cardio') exForm.muscle = 'Cardio';
  if (f !== 'name') sheetRefresh();
};
A.exNew = () => { const hold = picker; exFormSheet(null); picker = hold; };
A.exEdit = el => exFormSheet(exById(el.dataset.id));
function afterForm() { if (picker) { showPicker(); refreshExList(); } else { closeSheet(); render(); } }
A.xfCancel = () => { const hold = picker; if (hold) { showPicker(); refreshExList(); } else closeSheet(); };
A.xfSave = () => {
  const f = exForm; f.name = (f.name || '').trim(); if (!f.name) return toast('Give the exercise a name');
  if (S.exercises.some(e => e.id !== f.id && !e.hidden && e.name.toLowerCase() === f.name.toLowerCase())) return toast('An exercise with that name already exists');
  if (f.type !== 'distance') delete f.distUnit; else f.distUnit = f.distUnit || 'mi';
  if (f.id) { const i = S.exercises.findIndex(e => e.id === f.id); S.exercises[i] = f; }
  else { f.id = uid(); f.custom = true; S.exercises.push(f); if (picker) { if (!picker.multi) picker.sel.clear(); picker.sel.add(f.id); listState.q = ''; } }
  dbPut('exercises', f); afterForm();
};
A.xfDelete = () => {
  const id = exForm.id;
  confirmSheet('Delete exercise?', 'It is removed from your library. Past workouts keep their logged sets.', 'Delete', () => {
    const used = S.workouts.some(w => w.exercises.some(x => x.exId === id)) || S.routines.some(r => r.exercises.some(x => x.exId === id)) || (S.active && S.active.exercises.some(x => x.exId === id));
    const ex = S.exercises.find(e => e.id === id);
    if (used) { ex.hidden = true; dbPut('exercises', ex); } else { S.exercises = S.exercises.filter(e => e.id !== id); dbDel('exercises', id); }
    back();
  }, true);
};
I.exNotes = el => { const ex = S.exercises.find(e => e.id === el.dataset.id); if (!ex) return; ex.notes = el.value; grow(el); dbPut('exercises', ex); };
VIEWS.exercise = p => {
  const ex = exById(p.id), hist = exHistory(ex.id), { rec, repsAt } = records(ex.id), asc = hist.slice().reverse();
  const dispW = v => num(isKg() ? v / KG : v, 1) + ' ' + U();
  const sum = (sets, fn) => sets.filter(s => s.type !== 'warmup').reduce((a, s) => a + (fn(s) || 0), 0);
  const maxv = (sets, fn) => Math.max(0, ...sets.filter(s => s.type !== 'warmup').map(s => fn(s) || 0));
  const series = fn => asc.map(h => ({ t: h.w.start, v: fn(h) })).filter(p => p.v > 0);
  let charts = [];
  if (ex.type === 'weight_reps') charts = [['Estimated 1RM (Epley)', series(h => maxv(h.sets, s => e1rm(s.weight, s.reps))), dispW], ['Volume per workout', series(h => sum(h.sets, s => setVolume(ex, s, h.w.start))), fmtVol]];
  else if (ex.type === 'bodyweight') charts = [['Best reps in a set', series(h => maxv(h.sets, s => s.reps)), v => v + ' reps'], ['Volume per workout', series(h => sum(h.sets, s => setVolume(ex, s, h.w.start))), fmtVol]];
  else if (ex.type === 'duration') charts = [['Longest hold', series(h => maxv(h.sets, s => s.time)), fmtClock], ['Total time per workout', series(h => sum(h.sets, s => s.time)), fmtClock]];
  else charts = [['Distance per workout', series(h => sum(h.sets, s => s.distance)), v => `${num(v)} ${ex.distUnit}`],
  [`Pace (${ex.distUnit === 'm' ? 'per 500 m' : 'per ' + ex.distUnit})`, series(h => { const d = sum(h.sets, s => s.time > 0 ? s.distance : 0), t = sum(h.sets, s => s.distance > 0 ? s.time : 0); return d > 0 ? t / (ex.distUnit === 'm' ? d / 500 : d) : 0; }), fmtClock, true]];
  const order = ['weight', 'e1rm', 'vol', 'reps', 'added', 'time', 'dist', 'speed'].filter(k => rec[k]);
  const ra = [...repsAt.entries()].sort((a, b) => b[0] - a[0]);
  return `<div class="hdr"><button class="icon" data-a="back" aria-label="Back">‹</button><h1>${esc(ex.name)}</h1><button class="btn sm" data-a="exEdit" data-id="${ex.id}">Edit</button></div>
  <div class="pad"><div class="sub" style="margin:2px">${esc(ex.muscle)} · ${esc(ex.category)} · ${TYPES[ex.type]}</div>
    <textarea class="inp" style="margin-top:8px" rows="${Math.max(1, (ex.notes || '').split('\n').length)}" placeholder="Notes (seat height, cues…)" data-i="exNotes" data-id="${ex.id}">${esc(ex.notes || '')}</textarea>
    <h2 class="sec">Personal records</h2>
    <div class="card">${order.map(k => `<div class="kv"><span>${PR_LABEL[k]}</span><b>${esc(prValue(ex, k, rec[k]))}<div class="sub" style="font-weight:400">${fmtDateY(rec[k].date)}</div></b></div>`).join('') || '<div class="empty sm">No records yet — log this exercise to set some.</div>'}</div>
    ${charts.map((c, i) => `<h2 class="sec">${c[0]}</h2><div class="card">${lineChart(c[1], c[2], 'c' + i, c[3])}</div>`).join('')}
    ${ra.length ? `<h2 class="sec">Best reps at each ${ex.type === 'bodyweight' ? 'added weight' : 'weight'}</h2><div class="card">${ra.map(([w, r]) => `<div class="kv"><span>${ex.type === 'bodyweight' ? (w ? signed(w) + ' ' + U() : 'Bodyweight') : wOut(w) + ' ' + U()}</span><b>${r.reps} reps <span class="sub" style="font-weight:400">· ${fmtDateY(r.date)}</span></b></div>`).join('')}</div>` : ''}
    <h2 class="sec">History</h2>
    ${hist.map(h => `<div class="card"><button style="display:block;text-align:left;width:100%;min-height:36px" data-a="go" data-v="workout" data-id="${h.w.id}"><b>${fmtDate(h.w.start, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}</b> <span class="sub">· ${esc(h.w.name)} ›</span></button>
      ${h.we.notes ? `<div class="sub" style="white-space:pre-wrap">${esc(h.we.notes)}</div>` : ''}${setLines(ex, h.sets)}</div>`).join('') || '<div class="empty sm">You haven’t logged this exercise yet.</div>'}
  </div>`;
};

/* ---------------- Progress: weekly summary + body weight ---------------- */
let weekOff = 0;
VIEWS.progress = () => {
  const ws = new Date(weekStart(Date.now())); ws.setDate(ws.getDate() + weekOff * 7); const a = ws.getTime(), we = new Date(a); we.setDate(we.getDate() + 7); const b = we.getTime();
  const wk = S.workouts.filter(w => w.start >= a && w.start < b); let vol = 0, sets = 0, dur = 0; const mus = {};
  for (const w of wk) { const st = wStats(w); vol += st.vol; sets += st.sets; dur += st.dur; for (const x of w.exercises) { const m = exById(x.exId).muscle, n = x.sets.filter(s => s.done && s.type !== 'warmup').length; if (n) mus[m] = (mus[m] || 0) + n; } }
  const ml = Object.entries(mus).sort((x, y) => y[1] - x[1]), mmax = ml.length ? ml[0][1] : 1;
  const label = weekOff === 0 ? 'This week' : weekOff === -1 ? 'Last week' : '';
  const bws = S.bodyweights, lastBw = bws[bws.length - 1];
  return `<div class="hdr"><h1>Progress</h1></div><div class="pad">
    <div class="card"><div style="display:flex;align-items:center"><button class="icon" data-a="weekNav" data-d="-1" aria-label="Previous week">‹</button><div style="flex:1;text-align:center"><b>${label || 'Week of ' + fmtDate(a, { month: 'short', day: 'numeric' })}</b><div class="sub">${fmtDate(a, { month: 'short', day: 'numeric' })} – ${fmtDate(b - 864e5, { month: 'short', day: 'numeric' })}</div></div><button class="icon" data-a="weekNav" data-d="1" ${weekOff >= 0 ? 'style="opacity:.25"' : ''} aria-label="Next week">›</button></div>
      <div class="stats" style="margin-bottom:0"><div class="stat" style="background:var(--card2)"><b>${wk.length}</b><span>Workouts</span></div><div class="stat" style="background:var(--card2)"><b>${fmtVol(vol)}</b><span>Volume</span></div><div class="stat" style="background:var(--card2)"><b>${sets}</b><span>Sets</span></div></div>
      ${wk.length ? `<div class="sub" style="margin:8px 2px 0">Time training: ${fmtDurLong(dur)}</div>` : ''}</div>
    <h2 class="sec">Sets per muscle group</h2>
    <div class="card">${ml.map(([m, n]) => `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${m}</span><b>${n}</b></div><div class="bar"><i style="width:${n / mmax * 100}%"></i></div></div>`).join('') || '<div class="empty sm">No sets logged this week.</div>'}</div>
    <h2 class="sec">Body weight</h2>
    <div class="card"><div style="display:flex;gap:8px"><input class="inp" id="bwDate" type="date" value="${dayKey(Date.now())}" max="${dayKey(Date.now())}" style="flex:1.3;min-width:0" aria-label="Date"><input class="inp" id="bwVal" inputmode="decimal" placeholder="${lastBw ? wOut(lastBw.weight) : U()}" style="flex:1;min-width:0;text-align:center" aria-label="Body weight"><button class="btn primary" data-a="bwLog">Log</button></div>
      <div style="margin-top:12px">${lineChart(bws.map(x => ({ t: new Date(x.date + 'T12:00').getTime(), v: x.weight })), v => num(isKg() ? v / KG : v, 1) + ' ' + U(), 'bw', 'none')}</div>
      ${bws.slice(-6).reverse().map(x => `<div class="kv" style="align-items:center"><span>${fmtDateY(new Date(x.date + 'T12:00').getTime())}</span><b>${wOut(x.weight)} ${U()} <button data-a="bwDel" data-id="${x.id}" style="color:var(--muted);padding:6px 4px 6px 12px" aria-label="Delete entry">✕</button></b></div>`).join('')}</div>
    <div class="sub" style="text-align:center;margin-top:14px">${S.workouts.length} workout${S.workouts.length === 1 ? '' : 's'} logged all-time</div>
  </div>`;
};
A.weekNav = el => { weekOff = Math.min(0, weekOff + +el.dataset.d); render(); };
A.bwLog = () => {
  const v = wIn($('#bwVal').value), d = $('#bwDate').value || dayKey(Date.now()); if (v == null || v <= 0) return toast('Enter your weight');
  const e = { id: d, date: d, weight: v }; S.bodyweights = S.bodyweights.filter(x => x.id !== d); S.bodyweights.push(e); S.bodyweights.sort((a, b) => a.date < b.date ? -1 : 1);
  dbPut('bodyweights', e); render(); toast('Body weight logged');
};
A.bwDel = el => { S.bodyweights = S.bodyweights.filter(x => x.id !== el.dataset.id); dbDel('bodyweights', el.dataset.id); render(); };

/* ---------------- Settings + backup ---------------- */
function applyTheme() {
  document.documentElement.dataset.theme = S.settings.theme; const m = $('meta[name=theme-color]'); if (m) m.content = S.settings.theme === 'light' ? '#f3f4f6' : '#0b0c0e';
}
VIEWS.settings = () => {
  const s = S.settings, tg = (k, label, hint) => `<div class="row"><div class="grow"><div class="t">${label}</div>${hint ? `<div class="sub">${hint}</div>` : ''}</div><button class="toggle ${s[k] ? 'on' : ''}" data-a="setToggle" data-k="${k}" role="switch" aria-checked="${!!s[k]}" aria-label="${label}"></button></div>`;
  const seg = (k, opts) => `<div class="seg">${opts.map(([v, l]) => `<button class="${s[k] === v ? 'on' : ''}" data-a="setOpt" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
  return `<div class="hdr"><h1>Settings</h1></div><div class="pad">
    <div class="list"><div class="row"><div class="grow t">Units</div>${seg('unit', [['lb', 'lb'], ['kg', 'kg']])}</div>
      <div class="row"><div class="grow t">Theme</div>${seg('theme', [['dark', 'Dark'], ['light', 'Light']])}</div>
      <div class="row"><div class="grow"><div class="t">Default rest timer</div><div class="sub">For exercises you add mid-workout</div></div><select class="inp" style="width:110px" data-i="setRestDefault">${REST_OPTS.map(o => `<option value="${o}" ${s.defaultRest === o ? 'selected' : ''}>${o ? fmtClock(o) : 'Off'}</option>`).join('')}</select></div>
      ${tg('sound', 'Timer sound', 'Beeps when rest ends (needs the ringer on)')}
      ${tg('vibrate', 'Timer vibration', navigator.vibrate ? '' : 'Not supported by iPhone browsers')}
      ${tg('wakeLock', 'Keep screen awake', 'While a workout is running')}</div>
    <h2 class="sec">Backup</h2>
    <div class="list"><button class="row" data-a="exportJson"><div class="grow"><div class="t">Export backup (JSON)</div><div class="sub">${s.lastBackup ? 'Last backup ' + fmtDateY(s.lastBackup) : 'Everything: workouts, routines, exercises, settings'}</div></div><span class="chev">›</span></button>
      <label class="row" style="cursor:pointer"><div class="grow"><div class="t">Import backup (JSON)</div><div class="sub">Replaces all data on this device</div></div><span class="chev">›</span><input type="file" accept=".json,application/json" data-c="importFile" hidden></label>
      <button class="row" data-a="exportCsv"><div class="grow"><div class="t">Export all sets (CSV)</div><div class="sub">One row per set, for spreadsheets</div></div><span class="chev">›</span></button></div>
    <h2 class="sec">Data</h2>
    <div class="card"><div class="kv"><span>Storage</span><b>${S.storage === 'memory' ? 'Not available — data will not persist' : 'On this device (IndexedDB)'}</b></div>
      <div class="kv"><span>Protected from cleanup</span><b>${S.persisted == null ? 'Unknown' : S.persisted ? 'Yes' : 'Not granted yet'}</b></div>
      <div class="kv"><span>Workouts / exercises</span><b>${S.workouts.length} / ${S.exercises.filter(e => !e.hidden).length}</b></div>
      <div class="kv"><span>Version</span><b>${APP_VERSION}</b></div></div>
    <button class="btn block danger" data-a="wipe">Delete all data</button>
  </div>`;
};
A.setToggle = el => { const k = el.dataset.k; S.settings[k] = !S.settings[k]; saveSettings(); if (k === 'wakeLock') syncWake(); if (k === 'sound' && S.settings.sound) { ensureAudio(); const v = S.settings.vibrate; S.settings.vibrate = false; beep(); S.settings.vibrate = v; } render(); };
A.setOpt = el => { S.settings[el.dataset.k] = el.dataset.v; saveSettings(); applyTheme(); render(); };
I.setRestDefault = el => { S.settings.defaultRest = +el.value; saveSettings(); };

async function saveFile(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  try {
    const f = new File([blob], name, { type: mime });
    if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return true;
}
function backupData() {
  return { app: 'liftlog', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, exercises: S.exercises, folders: S.folders, routines: S.routines, workouts: S.workouts, bodyweights: S.bodyweights, active: S.active };
}
A.exportJson = async () => {
  if (await saveFile(`liftlog-backup-${dayKey(Date.now())}.json`, JSON.stringify(backupData(), null, 1), 'application/json')) { S.settings.lastBackup = Date.now(); saveSettings(); if (topV().v === 'settings') render(); }
};
function csvText() {
  const q = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const rows = [['date', 'start_time', 'workout', 'workout_duration_min', 'exercise', 'category', 'muscle_group', 'set_number', 'set_type', 'weight', 'weight_unit', 'reps', 'time_seconds', 'distance', 'distance_unit', 'pace', 'rpe', 'est_1rm', 'superset', 'exercise_notes', 'workout_notes']];
  for (const w of S.workouts.slice().reverse()) for (const we of w.exercises) {
    const ex = exById(we.exId); we.sets.forEach((s, i) => {
      const d = new Date(w.start), one = ex.type === 'weight_reps' ? e1rm(s.weight, s.reps) : 0;
      rows.push([dayKey(w.start), `${pad2(d.getHours())}:${pad2(d.getMinutes())}`, w.name, Math.round((w.end - w.start) / 60000), ex.name, ex.category, ex.muscle, i + 1, s.type,
      s.weight != null ? wOut(s.weight) : '', s.weight != null ? U() : '', s.reps ?? '', s.time ?? '', s.distance ?? '', ex.type === 'distance' ? ex.distUnit : '', ex.type === 'distance' ? paceText(ex, s.distance, s.time) : '', s.rpe ?? '',
      one ? num(isKg() ? one / KG : one, 1) : '', we.supersetId ? 'yes' : '', we.notes || '', w.notes || '']);
    });
  }
  return rows.map(r => r.map(q).join(',')).join('\r\n');
}
A.exportCsv = () => { if (!S.workouts.length) return toast('No workouts to export yet'); saveFile(`liftlog-sets-${dayKey(Date.now())}.csv`, csvText(), 'text/csv'); };
async function importData(d) {
  S.exercises = d.exercises; S.workouts = d.workouts; S.routines = d.routines || []; S.folders = d.folders || []; S.bodyweights = d.bodyweights || [];
  Object.assign(S.settings, d.settings || {}); S.active = d.active || null;
  await Promise.all([dbReplace('exercises', S.exercises), dbReplace('workouts', S.workouts), dbReplace('routines', S.routines), dbReplace('folders', S.folders), dbReplace('bodyweights', S.bodyweights)]);
  await kvSet('seeded', true); await saveSettings(); await saveActive();
  sortWorkouts(); S.bodyweights.sort((a, b) => a.date < b.date ? -1 : 1); applyTheme(); tab('settings'); toast(`Imported ${S.workouts.length} workouts`);
}
I.importFile = async el => {
  const f = el.files && el.files[0]; el.value = ''; if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch (e) { return toast('That file is not valid JSON'); }
  const okArr = a => Array.isArray(a) && a.every(x => x && typeof x === 'object' && x.id);
  if (!d || !okArr(d.exercises) || !okArr(d.workouts) || !d.workouts.every(w => Array.isArray(w.exercises) && typeof w.start === 'number')) return toast('This doesn’t look like a LiftLog backup');
  confirmSheet('Replace all data?', `The backup has ${d.workouts.length} workouts and ${d.exercises.length} exercises. Everything currently on this device will be replaced.`, 'Import backup', () => importData(d), true);
};
A.wipe = () => confirmSheet('Delete all data?', 'Every workout, routine and custom exercise on this device is erased. Export a backup first if you might want it back.', 'Delete everything', async () => {
  for (const s of STORES) await dbReplace(s, []);
  location.reload();
}, true);

/* ---------------- boot ---------------- */
(async () => {
  await loadAll(); applyTheme();
  if (S.active) { stack = [{ v: 'home', p: {} }, { v: 'live', p: {} }]; syncWake(); }
  render(0);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
</body>
</html>
